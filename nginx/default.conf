server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve static assets directly; return 404 if missing to avoid SPA HTML
    location ~* \.(?:css|js|map|json|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}